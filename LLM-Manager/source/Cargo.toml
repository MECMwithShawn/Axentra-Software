[package]
name = "llm-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }

[profile.dev]
debug = 0
