[package]
name = "axentra-notepad"
description = "Axentra Notepad: text and code editing with tabs, syntax highlighting and find in files"
version = "0.1.5"
edition = "2021"
license = "MIT"

[[bin]]
name = "AxentraNotepad"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same webview pins as Axentra Command, CrystalWire and Excel.
wry = { version = "=0.50.5", features = ["linux-body"] }
tao = "~0.32"
encoding_rs = "0.8"
regex = "1"
# ripgrep's walker: .gitignore-aware folder listing and find in files.
ignore = "0.4"
globset = "0.4"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
# Same version wry uses; only to turn off GPU rendering.
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }

[profile.release]
lto = true
codegen-units = 1
