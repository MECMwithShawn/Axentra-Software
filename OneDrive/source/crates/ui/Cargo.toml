[package]
name = "axentra-onedrive-ui"
description = "Axentra OneDrive tray icon, activity flyout and settings window (Fluent style)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "AxentraOneDrive"
path = "src/main.rs"

[dependencies]
axentra-onedrive-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
zbus.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "software-renderer-path", "image-default-formats", "accessibility"] }
ksni = { version = "0.3", features = ["tokio"], default-features = false }
png = "0.17"
arboard = { version = "3", default-features = false }
futures-util.workspace = true
url.workspace = true

[build-dependencies]
slint-build = "1.18"
