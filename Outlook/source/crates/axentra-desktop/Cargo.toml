[package]
name = "axentra-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "axentra-outlook"
path = "src/main.rs"

[dependencies]
axentra-ui.workspace = true
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "document", "mounted", "launch", "desktop"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axentra-core.workspace = true
axentra-sync.workspace = true
chrono.workspace = true
# Single instance (instance.rs): the profile key's hash and the runtime
# directory's ownership checks. Same versions as the rest of the tree.
sha2 = "=0.10.9"
libc = "0.2"

# The tao window's GTK side, for the compositor's tiled states (titlebar.rs).
# Same version as tao's own.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
