[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/axentra-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
axentra-core = { path = "crates/axentra-core" }
axentra-sync = { path = "crates/axentra-sync" }
axentra-ui = { path = "crates/axentra-ui" }

dioxus = { version = "=0.7.10", default-features = false }
dioxus-liveview = { version = "=0.7.10", features = ["axum"] }
axum = "0.8"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
thiserror = "2"
ammonia = "4.2"
mail-parser = "0.11"
mail-builder = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
