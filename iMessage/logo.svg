<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Axentra iMessage</title>
  <desc>Ice-blue conversation mark on the Axentra suite's dark metallic tile.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#daf0ff"/><stop offset=".16" stop-color="#b1d6fa"/>
      <stop offset=".42" stop-color="#344a69"/><stop offset=".7" stop-color="#518ac7"/>
      <stop offset="1" stop-color="#b7ddff"/>
    </linearGradient>
    <linearGradient id="tile" x2=".8" y2="1">
      <stop stop-color="#1b1c30"/><stop offset=".5" stop-color="#10121e"/><stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5ba7f3" stop-opacity=".22"/><stop offset="1" stop-color="#5ba7f3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x2=".65" y2="1">
      <stop stop-color="#e3f4ff"/><stop offset=".45" stop-color="#b7ddff"/><stop offset="1" stop-color="#77b5f4"/>
    </linearGradient>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="symbolHalo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <path id="conversation" d="M22 18h20c5.5 0 9 3.9 9 9v6c0 5.6-4 9.5-9.5 9.5H29L18 49l2.1-8.2C15.5 39.2 13 35.8 13 31.3V27c0-5.1 3.8-9 9-9Z"/>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#9dcef7" stroke-width="1.6" opacity=".4" filter="url(#halo)"/>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.4"/>
  <rect x="5" y="5" width="54" height="54" rx="8.5" fill="none" stroke="#c7e3f8" stroke-opacity=".07"/>
  <circle cx="32" cy="29" r="26" fill="url(#glow)"/>
  <use href="#conversation" fill="none" stroke="#74b9ff" stroke-width="2" opacity=".16" filter="url(#symbolHalo)"/>
  <use href="#conversation" fill="#87c4ff" fill-opacity=".035" stroke="url(#line)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="url(#line)"><circle cx="24" cy="30" r="2"/><circle cx="32" cy="30" r="2"/><circle cx="40" cy="30" r="2"/></g>
</svg>
